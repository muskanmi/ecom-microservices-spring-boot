spring.application.name=seller-admin-service

server.port=8087

spring.config.import=optional:file:.env[.properties]

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/seller_admin_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# SERVICE URLs
# =========================================================

order.service.url=http://localhost:8083
catalog.service.url=http://localhost:8082
auth.service.url=http://localhost:8081
payment.service.url=http://localhost:8085
notification.service.url=http://localhost:8086

# =========================================================
# INTERNAL SERVICE SECURITY
# =========================================================

internal.service.key=${INTERNAL_SERVICE_KEY}