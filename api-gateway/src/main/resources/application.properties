
spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=catalog-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.mvc.routes[2].id=order-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.mvc.routes[3].id=payment-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8085
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.mvc.routes[4].id=seller-admin-service
spring.cloud.gateway.mvc.routes[4].uri=http://localhost:8087
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/seller/**

# Cart -> Order Service
spring.cloud.gateway.mvc.routes[5].id=cart-service
spring.cloud.gateway.mvc.routes[5].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/cart/**

# Wishlist -> Catalog Service
spring.cloud.gateway.mvc.routes[6].id=wishlist-service
spring.cloud.gateway.mvc.routes[6].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[6].predicates[0]=Path=/api/wishlist/**

# Categories -> Catalog Service
spring.cloud.gateway.mvc.routes[7].id=category-service
spring.cloud.gateway.mvc.routes[7].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[7].predicates[0]=Path=/api/categories/**

# Platform Admin -> Auth Service
spring.cloud.gateway.mvc.routes[8].id=platform-admin-service
spring.cloud.gateway.mvc.routes[8].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[8].predicates[0]=Path=/api/admin/**

spring.config.import=optional:file:.env[.properties]
jwt.secret=${JWT_SECRET}
